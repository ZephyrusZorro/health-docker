# ==============================================================================
# Health Docker — Local development stack
# ==============================================================================
# Brings up: PostgreSQL, Redis, MinIO (S3), Mailpit, Laravel backend, Next.js
# frontend, and Laravel Reverb (WebSockets).
#
# Production note: use this as a starting point. For real deployment, switch
# to managed Postgres/Redis, a real S3 bucket, and an SMTP/SES provider.
# ==============================================================================

name: health-docker

services:
  # ---------- Data layer -------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: nishat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nishat_hms
      POSTGRES_USER: nishat
      POSTGRES_PASSWORD: nishat_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nishat -d nishat_hms"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nishat-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: nishat-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: nishat-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI

  # ---------- Application ------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: nishat-backend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./backend:/app
      - /app/vendor
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: nishat_hms
      DB_USERNAME: nishat
      DB_PASSWORD: nishat_secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: nishat
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: no-reply@nishat.local
      MAIL_FROM_NAME: "Nishat HMS"
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    command: php artisan serve --host=0.0.0.0 --port=8000

  queue-worker:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: nishat-queue
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./backend:/app
      - /app/vendor
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: nishat_hms
      DB_USERNAME: nishat
      DB_PASSWORD: nishat_secret
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    depends_on:
      - backend
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90

  reverb:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: nishat-reverb
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./backend:/app
      - /app/vendor
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      REDIS_HOST: redis
      BROADCAST_CONNECTION: reverb
    ports:
      - "8080:8080"
    depends_on:
      - backend
    command: php artisan reverb:start --host=0.0.0.0 --port=8080

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: nishat-frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
  minio_data:
